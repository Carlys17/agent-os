name: Documentation issue
description: Report missing, confusing, or outdated AgentOS documentation
title: "[Docs]: "
labels: ["type: documentation", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for improving AgentOS's docs. Do not include credentials, provider tokens, private transcripts, account identifiers, or sensitive local paths.
  - type: checkboxes
    id: duplicates
    attributes:
      label: Duplicate check
      options:
        - label: I searched the existing open and closed issues and this is not a duplicate.
          required: true
  - type: markdown
    attributes:
      value: |
        A maintainer will add the matching `area:` and `priority:` labels after triage. Comment on the issue if you want to work on it and you will be assigned; see CONTRIBUTING.md for the full issue and pull request workflow.
  - type: input
    id: page
    attributes:
      label: Page or section
      description: Link the page, heading, or command example that needs work.
      placeholder: "docs/quickstart.md, docs/features/memory.md, or a GitHub URL"
    validations:
      required: true
  - type: dropdown
    id: issue_type
    attributes:
      label: Issue type
      options:
        - Incorrect command or option
        - Missing setup step
        - Confusing explanation
        - Missing feature guide
        - Broken link
        - Screenshot or UI mismatch
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: Describe what you expected to learn and where the documentation fell short.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: If you know the correction, include the command, wording, or link that would help.
    validations:
      required: false
