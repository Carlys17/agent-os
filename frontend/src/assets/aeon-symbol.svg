<?xml version="1.0" encoding="UTF-8"?>
<!-- Aeon brand mark: cream halftone star on a near-black tile.
     Vector rather than a copy of the raster original, so the silhouette stays
     crisp at tab size (~24px) where the halftone dots fall below one pixel and
     average out to flat tone. The two dot patterns invert across the star edge,
     matching the original artwork wherever the mark renders large. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <pattern id="aeon-dots-light" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="3.9" fill="#efecd9"/>
      <circle cx="13.5" cy="13.5" r="3.9" fill="#efecd9"/>
    </pattern>
    <pattern id="aeon-dots-dark" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="3.1" fill="#101010"/>
      <circle cx="13.5" cy="13.5" r="3.1" fill="#101010"/>
    </pattern>
    <clipPath id="aeon-star-clip"><path d="M 256.0 22.0 L 312.4 178.3 L 478.5 183.7 L 347.3 285.7 L 393.5 445.3 L 256.0 352.0 L 118.5 445.3 L 164.7 285.7 L 33.5 183.7 L 199.6 178.3 Z"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="#101010"/>
  <rect width="512" height="512" fill="url(#aeon-dots-light)" opacity="0.5"/>
  <path d="M 256.0 22.0 L 312.4 178.3 L 478.5 183.7 L 347.3 285.7 L 393.5 445.3 L 256.0 352.0 L 118.5 445.3 L 164.7 285.7 L 33.5 183.7 L 199.6 178.3 Z" fill="#efecd9"/>
  <g clip-path="url(#aeon-star-clip)">
    <rect width="512" height="512" fill="url(#aeon-dots-dark)" opacity="0.34"/>
  </g>
</svg>
